services:
  db:
    image: postgres:16-alpine
    container_name: megastar_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-megastar_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-megastar_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: megastar_web
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    container_name: megastar_bot
    restart: always
    command: python -m bot.main
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: